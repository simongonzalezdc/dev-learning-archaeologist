name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-and-secret-scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      # Moved from the Forgejo ci-profile when GitHub became the only CI
      # (GIT-CI-STRATEGY-20261123).
      - name: Syntax-check JavaScript
        run: for f in scripts/*.js tests/*.js; do node --check "$f"; done

      - name: Pack the skill files
        run: npm pack --dry-run

      - name: Run tests
        run: npm test

      - name: Check relative documentation links
        run: node scripts/check-doc-links.js

      - name: Set up Go for gitleaks
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.24.x"
          cache: false

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run gitleaks
        run: gitleaks dir . --redact --exit-code 1
